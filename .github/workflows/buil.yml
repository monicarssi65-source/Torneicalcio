name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    
    - uses: android-actions/setup-android@v3

    # --- STEP DI CORREZIONE AUTOMATICA ---
    - name: Fix Android Actions Environment Bug
      run: |
        echo "GRADLE_OPTS=-Xmx3072m" >> $GITHUB_ENV
        echo "JAVA_OPTS=-Xmx3072m" >> $GITHUB_ENV

    - run: chmod +x gradlew
    - run: ./gradlew clean assembleDebug --stacktrace
    
    - uses: actions/upload-artifact@v4
      with: { name: TorneiCalcio-APK, path: app/build/outputs/apk/debug/app-debug.apk }
