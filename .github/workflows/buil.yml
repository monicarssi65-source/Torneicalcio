name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: android-actions/setup-android@v3
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    # Raddrizziamo la creazione del wrapper
    - name: Regenerate Clean Wrapper (Safe Mode)
      run: gradle wrapper --gradle-version 8.7 --no-build-cache

    # --- INIZIO SOLUZIONE AL CONFLITTO REPOSITORY ---
    # Questo comando dice a Gradle di ignorare la severità del controllo sui repository duplicati
    - name: Fix Repository Configuration Conflict
      run: |
        if [ -f settings.gradle ]; then
          sed -i 's/repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)/repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)/g' settings.gradle
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle
        fi
        if [ -f settings.gradle.kts ]; then
          sed -i 's/repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)/repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)/g' settings.gradle.kts
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle.kts
        fi
    # --- FINE SOLUZIONE ---

    - run: chmod +x gradlew
    - run: ./gradlew clean assembleDebug --stacktrace
    
    - uses: actions/upload-artifact@v4
      with: { name: TorneiCalcio-APK, path: app/build/outputs/apk/debug/app-debug.apk }
