name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: android-actions/setup-android@v3
    - run: chmod +x gradlew
    
    - name: Run ./gradlew clean assembleDebug --stacktrace
      run: ./gradlew clean assembleDebug --stacktrace
      env:
        # Sovrascrive il bug eliminando le virgolette e dando memoria a Gradle
        GRADLE_OPTS: -Xmx2048m

    - uses: actions/upload-artifact@v4
      with: { name: TorneiCalcio-APK, path: app/build/outputs/apk/debug/app-debug.apk }
