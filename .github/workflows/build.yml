name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: android-actions/setup-android@v3
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    # Forziamo una versione stabile (8.7) ignorando gli script di build che mandano in crash Gradle 9
    - name: Regenerate Clean Wrapper (Safe Mode)
      run: gradle wrapper --gradle-version 8.7 --no-build-cache

    - run: chmod +x gradlew
    - run: ./gradlew clean assembleDebug --stacktrace
    
    - uses: actions/upload-artifact@v4
      with: { name: TorneiCalcio-APK, path: app/build/outputs/apk/debug/app-debug.apk }
