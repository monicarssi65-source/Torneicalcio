name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: android-actions/setup-android@v3
    
    # 1. Configura Gradle usando i binari ufficiali di GitHub (questo non fallirà)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    # 2. Questo comando genera un file gradle-wrapper.jar nuovo e valido direttamente sul server
    - name: Regenerate Missing Gradle Wrapper JAR
      run: gradle wrapper

    # 3. Ora il file esiste e la build può partire regolarmente
    - run: chmod +x gradlew
    - run: ./gradlew clean assembleDebug --stacktrace
    
    - uses: actions/upload-artifact@v4
      with: { name: TorneiCalcio-APK, path: app/build/outputs/apk/debug/app-debug.apk }
